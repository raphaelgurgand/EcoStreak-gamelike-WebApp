<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription – EcoStreak</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="container">
      <a class="logo" href="index.html">EcoStreak</a>
      <nav aria-label="Navigation principale"><ul><li><a href="login.html">Connexion</a></li></ul></nav>
    </div>
  </header>
  <main class="container">
    <div class="card form-card">
      <h1>Créer un compte</h1>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Nom affiché</label>
          <input type="text" id="name" autocomplete="nickname" aria-describedby="name-error">
          <p class="error" id="name-error"></p>
        </div>
        <div class="field">
          <label for="email">Adresse courriel</label>
          <input type="email" id="email" autocomplete="email" aria-describedby="email-error">
          <p class="error" id="email-error"></p>
        </div>
        <div class="field">
          <label for="password">Mot de passe (8 caractères minimum, avec un chiffre)</label>
          <input type="password" id="password" autocomplete="new-password" aria-describedby="password-error">
          <p class="error" id="password-error"></p>
        </div>
        <div class="field">
          <label for="confirm">Confirmer le mot de passe</label>
          <input type="password" id="confirm" autocomplete="new-password" aria-describedby="confirm-error">
          <p class="error" id="confirm-error"></p>
        </div>
        <button class="btn" type="submit">Créer mon compte</button>
      </form>
      <p class="muted">Déjà inscrit ? <a href="login.html">Connectez-vous</a></p>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
